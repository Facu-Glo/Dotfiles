# =============================================================================
# Modifier, aliases, and key bindings
# =============================================================================

# Base modifier for many default kitty shortcuts (Ctrl+Shift)
kitty_mod ctrl+shift

# Reusable alias to open a new tab in the current working directory
# Usage: map <key> launch_tab <program>
# action_alias launch_tab launch --type=tab --cwd=current

# ---------------------------------------------------------------------------
# Splits (window creation)
# ---------------------------------------------------------------------------

# Increase horizontal wm bias to 80 % (new vertical splits get more space)
# Smart version: swaps 80/50 depending on which side the active window is on
map ctrl+. kitten ~/.config/kitty/kittens/smart-bias.py period

# Reset horizontal wm bias to 50 %
map ctrl+, kitten ~/.config/kitty/kittens/smart-bias.py comma

# Split mode (tmux-like): press Ctrl+B, release, then press the action key
# map --new-mode wm --on-action end --on-unknown end ctrl+b
map --new-mode wm ctrl+b

#   v → vertical split + exit mode
map --mode wm v kitten ~/.config/kitty/kittens/modo_ventana.py vsplit
#   s → horizontal split + exit mode
map --mode wm s kitten ~/.config/kitty/kittens/modo_ventana.py hsplit
#   x → close window + exit mode
map --mode wm x kitten ~/.config/kitty/kittens/modo_ventana.py close

map --mode wm o kitten ~/.config/kitty/kittens/modo_ventana.py close_other

# Move the active window in the indicated direction
map --mode wm alt+k move_window up
map --mode wm alt+h move_window left
map --mode wm alt+l move_window right
map --mode wm alt+j move_window down

map --mode wm shift+k neighboring_window up
map --mode wm shift+h neighboring_window left
map --mode wm shift+l neighboring_window right
map --mode wm shift+j neighboring_window down

# Pane the active window
map --mode wm h kitten ~/.config/kitty/kittens/smart-resize.py left
map --mode wm j kitten ~/.config/kitty/kittens/smart-resize.py down
map --mode wm k kitten ~/.config/kitty/kittens/smart-resize.py up
map --mode wm l kitten ~/.config/kitty/kittens/smart-resize.py right

#   Esc → leave wm mode
map --mode wm esc pop_keyboard_mode
map --mode wm alt+e pop_keyboard_mode
map --mode wm ctrl+b pop_keyboard_mode
map --mode wm q pop_keyboard_mode

# ---------------------------------------------------------------------------
map --new-mode vim-mode ctrl+shift+x

map --mode vim-mode g scroll_home
map --mode vim-mode shift+g scroll_end

map --mode vim-mode j scroll_line_down
map --mode vim-mode k scroll_line_up
map --mode vim-mode d scroll_page_down
map --mode vim-mode u scroll_page_up

map --mode vim-mode z scroll_to_prompt -1
map --mode vim-mode x scroll_to_prompt 1

map --mode vim-mode e kitten ~/.config/kitty/kittens/scrollback.py

map --mode vim-mode esc pop_keyboard_mode
map --mode vim-mode alt+e pop_keyboard_mode
map --mode vim-mode q pop_keyboard_mode

# ---------------------------------------------------------------------------
# Close the active window
map kitty_mod+w       close_window

# ---------------------------------------------------------------------------
# Navigation (moving between windows)
# ---------------------------------------------------------------------------

# Next window (cycle forward)
map kitty_mod+} next_window

# Move to the window on the right
map ctrl+alt+l neighboring_window right

# Next window (alternative)
map ctrl+alt+} next_window

# Previous window (cycle backward)
map kitty_mod+{ previous_window

# Move to the window on the left
map ctrl+alt+h neighboring_window left

# Previous window (alternative)
map ctrl+alt+{ previous_window

# Move to the window below
map ctrl+alt+j neighboring_window down

# Move to the window above
map ctrl+alt+k neighboring_window up

# ---------------------------------------------------------------------------
# Focus
# ---------------------------------------------------------------------------

# Show overlay numbers on all windows, then focus the selected one
map kitty_mod+f7 focus_visible_window

# Same, but with a quicker shortcut
map alt+w focus_visible_window

# ---------------------------------------------------------------------------
# Tabs
# ---------------------------------------------------------------------------

# Next tab (like browser Ctrl+Tab)
map ctrl+tab        next_tab

# Previous tab
map ctrl+shift+tab previous_tab

# New tab in the current working directory
map kitty_mod+t new_tab_with_cwd

# Go to tab by index (1‑5)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# ---------------------------------------------------------------------------
# Layouts
# ---------------------------------------------------------------------------

# Cycle to the next window layout
map kitty_mod+l next_layout

# Toggle between 'stack' and the previous layout (zoom the active window)
map ctrl+alt+z toggle_layout stack
