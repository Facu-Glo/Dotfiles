# =============================================================================
# Modifier, aliases, and key bindings
# =============================================================================

# Base modifier for many default kitty shortcuts (Ctrl+Shift)
kitty_mod ctrl+shift

# Reusable alias to open a new tab in the current working directory
# Usage: map <key> launch_tab <program>
action_alias launch_tab launch --type=tab --cwd=current

# ---------------------------------------------------------------------------
# Splits (window creation)
# ---------------------------------------------------------------------------

# Increase horizontal split bias to 80 % (new vertical splits get more space)
map ctrl+. layout_action bias 80

# Reset horizontal split bias to 50 %
map ctrl+, layout_action bias 50

# New window in the current layout (default full split)
map kitty_mod+enter new_window

# Split mode (tmux-like): press Ctrl+B, release, then press the action key
map --new-mode split --on-action end --on-unknown end ctrl+b

#   | → vertical split
map --mode split | launch --location=vsplit --cwd=current
#   v → vertical split
map --mode split v launch --location=vsplit --cwd=current
#   - → horizontal split
map --mode split - launch --location=hsplit --cwd=current
#   s → horizontal split
map --mode split s launch --location=hsplit --cwd=current
#   x → close window
map --mode split x close_window
#   Esc → leave split mode
map --mode split esc pop_keyboard_mode
map --mode split alt+e pop_keyboard_mode

# Close the active window
map kitty_mod+w       close_window

# ---------------------------------------------------------------------------
# Manage
# ---------------------------------------------------------------------------

# Create a new "manage windows" mode (manage)
map --new-mode manage ctrl+shift+r

# Move the active window in the indicated direction
map --mode manage shift+k move_window up
map --mode manage shift+h move_window left
map --mode manage shift+l move_window right
map --mode manage shift+j move_window down

# Pane the active window
map --mode manage h kitten ~/.config/kitty/smart-resize.py left
map --mode manage j kitten ~/.config/kitty/smart-resize.py down
map --mode manage k kitten ~/.config/kitty/smart-resize.py up
map --mode manage l kitten ~/.config/kitty/smart-resize.py right

# Exit the manage window mode
map --mode manage esc pop_keyboard_mode
map --mode manage alt+e pop_keyboard_mode

# ---------------------------------------------------------------------------
# Navigation (moving between windows)
# ---------------------------------------------------------------------------

# Next window (cycle forward)
map kitty_mod+} next_window

# Move to the window on the right
map ctrl+alt+l neighboring_window right

# Next window (alternative)
map ctrl+alt+} next_window

# Previous window (cycle backward)
map kitty_mod+{ previous_window

# Move to the window on the left
map ctrl+alt+h neighboring_window left

# Previous window (alternative)
map ctrl+alt+{ previous_window

# Move to the window below
map ctrl+alt+j neighboring_window down

# Move to the window above
map ctrl+alt+k neighboring_window up

# ---------------------------------------------------------------------------
# Focus
# ---------------------------------------------------------------------------

# Show overlay numbers on all windows, then focus the selected one
map kitty_mod+f7 focus_visible_window

# Same, but with a quicker shortcut
map alt+w focus_visible_window

# ---------------------------------------------------------------------------
# Tabs
# ---------------------------------------------------------------------------

# Next tab (like browser Ctrl+Tab)
map ctrl+tab        next_tab

# Previous tab
map ctrl+shift+tab previous_tab

# New tab in the current working directory
map kitty_mod+t new_tab_with_cwd

# Go to tab by index (1‑5)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# ---------------------------------------------------------------------------
# Layouts
# ---------------------------------------------------------------------------

# Cycle to the next window layout
map kitty_mod+l next_layout

# Toggle between 'stack' and the previous layout (zoom the active window)
map ctrl+alt+z toggle_layout stack
