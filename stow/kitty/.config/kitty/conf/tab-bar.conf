# =============================================================================
# Tab bar
# =============================================================================
# Uses a custom Python renderer (tab_bar.py) for a more informative tab bar
# that shows the current directory project name and tab index.
# =============================================================================

# Position of the tab bar (top or bottom)
tab_bar_edge top

# 'custom' loads tab_bar.py from the kitty config directory
tab_bar_style custom

# Show the tab bar even with a single tab (always visible)
tab_bar_min_tabs 1

# No separator string between tabs (the custom renderer handles its own style)
tab_separator ""

# Template for inactive tabs: "index: project-folder-name"
tab_title_template         " {index}: {tab.active_wd.rsplit('/', 1)[-1]} "

# Same format, but for the currently active tab
active_tab_title_template  " {index}: {tab.active_wd.rsplit('/', 1)[-1]} "
