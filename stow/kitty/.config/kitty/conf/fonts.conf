# =============================================================================
# Fonts
# =============================================================================
# All font-related settings. JetBrainsMono Nerd Font is the primary choice
# for its coding ligatures and wide Unicode coverage (icons, powerline, etc.).
# =============================================================================

# Default font size in points
font_size 14.0

# Main font face (regular weight)
font_family      family="JetBrainsMono Nerd Font"

# Bold variant — uses ExtraBold weight for clear distinction
bold_font        family="JetBrainsMono Nerd Font" style=ExtraBold

# Italic variant
italic_font      family="JetBrainsMono Nerd Font"

# Bold-italic variant
bold_italic_font family="JetBrainsMono Nerd Font" style=Bold
