# =============================================================================
# Shell integration, selection, audio, transparency, and notifications
# =============================================================================

# Disable shell integration cursor control (kitty wont change cursor shape
# at shell prompts — keeps the user-configured cursor shape)
shell_integration no-cursor

# Automatically copy selected text to the system clipboard
copy_on_select yes

# Allow the terminal bell sound
enable_audio_bell no

visual_bell_duration 0.3

# Background transparency level (0 = fully transparent, 1 = fully opaque)
background_opacity 0.80

# Blur the content behind the transparent window (requires compositor)
background_blur 1

# Send a desktop notification when a long-running command finishes and the
# window does not currently have focus
notify_on_cmd_finish unfocused

# ---------------------------------------------------------------------------
# Scrollback pager (use Neovim 0.12+ to browse terminal history)
# ---------------------------------------------------------------------------

scrollback_pager nvim --cmd 'let g:is_scrollback_pager=1|set eventignore=FileType' +'call nvim_open_term(0, {})' +'set nomodified nolist number' +CURSOR_LINE -
