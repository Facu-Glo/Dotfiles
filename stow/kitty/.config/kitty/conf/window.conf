# =============================================================================
# Window layout, borders, and appearance
# =============================================================================

# Available layouts: splits (tiling) and stack (fullscreen-like tabbing).
# The first listed layout is the default on startup.
enabled_layouts splits,stack

# Thickness of borders between windows (0.1 points — near-invisible)
window_border_width 0.1pt

# Only draw borders where windows actually touch (no phantom borders)
draw_minimal_borders yes

# Blank space around the window area (set to 0 for maximum space usage)
window_margin_width 0

# Fade inactive windows to 40 % opacity so the active window stands out
inactive_text_alpha 0.4

# Remove OS title bar and window decorations (cleaner look)
hide_window_decorations yes
